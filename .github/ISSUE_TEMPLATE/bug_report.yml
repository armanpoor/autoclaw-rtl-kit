name: گزارش خطا
description: چیزی درست کار نمی‌کند
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        پیش از ثبت، بخش عیب‌یابی مستندات را ببینید:
        https://github.com/armanpoor/autoclaw-rtl-kit/blob/main/docs/troubleshooting.md
  - type: textarea
    id: what-happened
    attributes:
      label: چه اتفاقی افتاد
      description: رفتار واقعی و رفتار مورد انتظار
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: مراحل بازتولید
      placeholder: |
        ۱. فایل ... را با دستور ... اجرا کردم
        ۲. خروجی ... بود
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: محیط
      options:
        - AutoClaw
        - VS Code
        - GitHub
        - ترمینال ویندوز
        - سایر
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: نسخه
      description: خروجی `git rev-parse --short HEAD` یا نسخهٔ انتشار
    validations:
      required: false
