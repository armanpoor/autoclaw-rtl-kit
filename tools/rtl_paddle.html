<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>لوح راست‌چین — نمایش درست متن فارسی</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"/>
<style>
  :root{--bg:#0f1519;--panel:#151d23;--line:#27323a;--fg:#e8eef2;--muted:#9fb0bb;--accent:#4cb0f0}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:"Vazirmatn","IRANSansX","Segoe UI","Tahoma",sans-serif}
  header{display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;border-bottom:1px solid var(--line);
         background:var(--panel);flex-wrap:wrap}
  header h1{margin:0;font-size:1rem;font-weight:700;color:var(--accent);margin-inline-end:auto}
  button{font-family:inherit;font-size:.9rem;color:var(--fg);background:#1d272f;border:1px solid var(--line);
         border-radius:7px;padding:.38rem .8rem;cursor:pointer}
  button:hover{border-color:var(--accent);color:var(--accent)}
  main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:0;height:calc(100% - 3.2rem)}
  @media (max-width:820px){main{grid-template-columns:1fr;grid-template-rows:35% 65%}}
  .pane{display:flex;flex-direction:column;min-height:0;min-width:0}
  .pane + .pane{border-inline-start:1px solid var(--line)}
  .pane-title{font-size:.78rem;color:var(--muted);padding:.45rem .9rem;border-bottom:1px solid var(--line)}
  textarea{flex:1;resize:none;border:0;outline:0;padding:1rem;background:#0c1116;color:#cfe0ea;
           font-family:"Cascadia Mono","Consolas",monospace;font-size:.86rem;line-height:1.8;direction:ltr;text-align:left}
  #out{flex:1;overflow:auto;padding:1.2rem 1.6rem;background:#fbfaf7;color:#15232c;
       font-size:15.5px;line-height:2;text-align:justify}
  #out p{margin:0 0 .95em;unicode-bidi:plaintext;text-align:start}
  #out pre{direction:ltr;text-align:left;unicode-bidi:isolate;background:#0f1b24;color:#e6edf3;
           padding:.85em 1em;border-radius:8px;overflow-x:auto;font-size:.86em;line-height:1.65;
           font-family:"Cascadia Mono","Consolas",monospace;white-space:pre-wrap}
  #out code{direction:ltr;unicode-bidi:isolate;font-family:"Cascadia Mono","Consolas",monospace;
            background:#e8edf1;padding:.05em .3em;border-radius:4px;font-size:.9em}
  #out .iso{unicode-bidi:isolate}
  .hint{font-size:.78rem;color:var(--muted);padding:.35rem .9rem;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <h1>لوح راست‌چین</h1>
  <button id="paste">چسباندن از کلیپ‌بورد</button>
  <button id="smaller">کوچک‌تر</button>
  <button id="bigger">بزرگ‌تر</button>
  <button id="clear">پاک کردن</button>
</header>
<main>
  <section class="pane">
    <div class="pane-title">متن خام (هرچه از پیام‌رسان یا ترمینال کپی کردید اینجا بچسبانید)</div>
    <textarea id="src" spellcheck="false" placeholder="متن فارسی را اینجا بچسبانید…"></textarea>
    <div class="hint">هر پاراگراف جداگانه تشخیص جهت می‌شود؛ خطوط انگلیسی و کد چپ‌به‌راست می‌مانند. ذخیره خودکار در همین مرورگر.</div>
  </section>
  <section class="pane">
    <div class="pane-title">نمایش راست‌چین</div>
    <div id="out"></div>
  </section>
</main>
<script>
(function(){
  var src = document.getElementById('src');
  var out = document.getElementById('out');
  var size = 15.5;

  function esc(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function inline(t){
    return esc(t)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\(([^()\n]{0,80})\)/g, function(m, g){
        return /[A-Za-z0-9%°×+\-]/.test(g) ? '<span class="iso">(' + g + ')</span>' : m;
      });
  }

  function render(){
    var blocks = src.value.replace(/\r\n/g,'\n').split(/\n{2,}/);
    var html = '';
    for (var i = 0; i < blocks.length; i++){
      var block = blocks[i].trim();
      if (!block) continue;
      var fence = block.match(/^```[\w+#-]*\n?([\s\S]*?)```$/);
      if (fence){ html += '<pre>' + esc(fence[1].replace(/\n$/,'')) + '</pre>'; continue; }
      if (/^#{1,6}\s/.test(block)){
        html += '<p><strong>' + inline(block.replace(/^#{1,6}\s+/,'')) + '</strong></p>';
        continue;
      }
      var lines = block.split('\n').map(function(l){ return inline(l.replace(/^\s*(?:[-*+]|\d+[.)])\s+/,'')); });
      html += '<p>' + lines.join('<br/>') + '</p>';
    }
    out.innerHTML = html || '<p style="color:#8a97a0">هنوز متنی وارد نشده است.</p>';
  }

  src.addEventListener('input', function(){
    render();
    try { localStorage.setItem('rtl_paddle_text', src.value); } catch(e){}
  });

  document.getElementById('clear').onclick = function(){
    src.value = ''; render();
    try { localStorage.removeItem('rtl_paddle_text'); } catch(e){}
    src.focus();
  };
  document.getElementById('bigger').onclick = function(){ size = Math.min(size + 1, 26); out.style.fontSize = size + 'px'; };
  document.getElementById('smaller').onclick = function(){ size = Math.max(size - 1, 11); out.style.fontSize = size + 'px'; };
  document.getElementById('paste').onclick = function(){
    if (!navigator.clipboard || !navigator.clipboard.readText){
      src.focus(); return;
    }
    navigator.clipboard.readText().then(function(text){
      src.value = text; render();
      try { localStorage.setItem('rtl_paddle_text', text); } catch(e){}
    }).catch(function(){
      src.focus();
      src.placeholder = 'دسترسی به کلیپ‌بورد داده نشد؛ متن را دستی بچسبانید (Ctrl+V).';
    });
  };

  try {
    var saved = localStorage.getItem('rtl_paddle_text');
    if (saved){ src.value = saved; }
  } catch(e){}
  render();
})();
</script>
</body>
</html>
